name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go mod verify
      - run: make test
      - run: go vet ./internal/... ./integration ./cmd/bootstrap ./cmd/dataserver ./envoytest ./native

  images:
    name: Native module and data images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: make images

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - run: make chart
      - name: Render both issuer modes and rollover configuration
        run: |
          helm template kona charts/kona --namespace kona --set pki.mode=certgen > /dev/null
          helm template coffee charts/kona --namespace beans --set pki.mode=cert-manager > /dev/null
          helm template kona charts/kona --namespace kona --set pki.mode=cert-manager \
            --set pki.certManager.nextCA=true --set pki.certManager.leafIssuer=kona-ca-next > /dev/null
      - name: Reject unsupported issuer mode
        run: |
          if helm template kona charts/kona --set pki.mode=unsupported; then
            echo 'Expected invalid issuer mode to fail'
            exit 1
          fi
