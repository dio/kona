{{- if eq .Values.pki.mode "cert-manager" }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Release.Name }}-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-ca
spec:
  isCA: true
  commonName: kona-spike-ca
  secretName: {{ .Release.Name }}-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ .Release.Name }}-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Release.Name }}-ca
spec:
  ca:
    secretName: {{ .Release.Name }}-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-server
spec:
  secretName: {{ .Release.Name }}-server
  duration: 1h
  renewBefore: 20m
  dnsNames:
  - {{ .Release.Name }}-data.{{ .Release.Namespace }}.svc.cluster.local
  usages:
  - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: {{ default (printf "%s-ca" .Release.Name) .Values.pki.certManager.leafIssuer }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-client
spec:
  secretName: {{ .Release.Name }}-client
  duration: 1h
  renewBefore: 20m
  uris:
  - spiffe://kona.test/gateway
  usages:
  - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: {{ default (printf "%s-ca" .Release.Name) .Values.pki.certManager.leafIssuer }}
{{- if .Values.testIdentities }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-other-client
spec:
  secretName: {{ .Release.Name }}-other-client
  duration: 1h
  renewBefore: 20m
  uris:
  - spiffe://kona.test/other
  usages:
  - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ default (printf "%s-ca" .Release.Name) .Values.pki.certManager.leafIssuer }}
{{- end }}
{{- end }}
