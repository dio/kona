{{- if not (has .Values.pki.mode (list "certgen" "cert-manager")) }}
{{- fail "pki.mode must be certgen or cert-manager" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-bootstrap
rules:
- apiGroups: [""]
  resources: [secrets, configmaps]
  verbs: [create]
- apiGroups: [""]
  resources: [secrets]
  resourceNames:
  - {{ .Release.Name }}-ca
  - {{ .Release.Name }}-client
  - {{ .Release.Name }}-server
  - {{ .Release.Name }}-other-client
  verbs: [get]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [{{ .Release.Name }}-ca]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-bootstrap
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap-{{ .Release.Revision }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-bootstrap
      containers:
      - name: bootstrap
        image: "{{ .Values.images.data.repository }}:{{ .Values.images.data.tag }}"
        imagePullPolicy: {{ .Values.images.data.pullPolicy }}
        command: [/kona-bootstrap]
        env:
        - {name: NAMESPACE, value: {{ .Release.Namespace | quote }}}
        - {name: RELEASE, value: {{ .Release.Name | quote }}}
        - {name: MODE, value: {{ .Values.pki.mode | quote }}}
        - {name: TEST_IDENTITIES, value: {{ .Values.testIdentities | quote }}}
